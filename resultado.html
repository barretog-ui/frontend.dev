<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Localização</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      background-color: #f4f6f8;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .destaque {
      font-weight: bold;
      color: #222;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-top: 12px;
      transition: 0.2s;
    }
    .btn-email {
      background-color: #28a745;
      color: white;
    }
    .btn-email:hover {
      background-color: #218838;
    }
    .btn-voltar {
      background-color: #6c757d;
      color: white;
    }
    .btn-voltar:hover {
      background-color: #5a6268;
    }
    hr {
      border: 0;
      height: 1px;
      background: #eee;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Informações de Localização</h2>
    
    <div id="conteudo">
      <p>Carregando dados salvos...</p>
    </div>

    <!-- Botão de envio via cliente de e-mail -->
    <button id="btnEmail" class="btn btn-email" onclick="enviarPorEmail()" style="display: none;">
      ✉️ Enviar Dados por E-mail
    </button>

    <!-- Botão para retornar à tela inicial -->
    <a href="index.html" class="btn btn-voltar">← Voltar à Página Principal</a>
  </div>

  <script>
    // Variáveis globais para armazenar os dados formatados
    let enderecoTexto = "Endereço não identificado";
    let linkGoogleMaps = "";

    async function carregarDados() {
      const conteudo = document.getElementById("conteudo");
      const btnEmail = document.getElementById("btnEmail");
      const dadosSalvos = localStorage.getItem("dadosLocalizacao");

      if (!dadosSalvos) {
        conteudo.innerHTML = "<p style='color: red;'>Nenhuma localização encontrada. Por favor, volte à página principal e autorize a captura.</p>";
        return;
      }

      const { latitude, longitude, precisao, dataHora } = JSON.parse(dadosSalvos);
      linkGoogleMaps = `https://www.google.com/maps?q=${latitude},${longitude}`;

      conteudo.innerHTML = "<p>Identificando logradouro e cidade...</p>";

      try {
        // Consulta à API pública do OpenStreetMap para Geocodificação Reversa
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&addressdetails=1`;
        const resposta = await fetch(url, {
          headers: { 'Accept-Language': 'pt-BR' }
        });
        
        const dados = await resposta.json();
        const end = dados.address || {};

        const rua = end.road || end.pedestrian || end.street || "Rua não informada";
        const numero = end.house_number ? `, nº ${end.house_number}` : "";
        const bairro = end.suburb || end.neighbourhood || "Bairro não informado";
        const cidade = end.city || end.town || end.municipality || "Cidade não informada";
        const estado = end.state || "";

        enderecoTexto = `${rua}${numero} - ${bairro}, ${cidade} - ${estado}`;

        conteudo.innerHTML = `
          <p><span class="destaque">Rua/Logradouro:</span> ${rua}${numero}</p>
          <p><span class="destaque">Bairro:</span> ${bairro}</p>
          <p><span class="destaque">Cidade/UF:</span> ${cidade} - ${estado}</p>
          <hr>
          <p><span class="destaque">Latitude:</span> ${latitude.toFixed(6)}</p>
          <p><span class="destaque">Longitude:</span> ${longitude.toFixed(6)}</p>
          <p><span class="destaque">Precisão:</span> ~${Math.round(precisao)} metros</p>
          <p><span class="destaque">Data/Hora:</span> ${dataHora}</p>
          <hr>
          <p><a href="${linkGoogleMaps}" target="_blank" style="color: #007bff; font-weight: bold;">📍 Abrir no Google Maps</a></p>
        `;
      } catch (erro) {
        conteudo.innerHTML = `
          <p><span class="destaque">Latitude:</span> ${latitude}</p>
          <p><span class="destaque">Longitude:</span> ${longitude}</p>
          <p><span class="destaque">Data/Hora:</span> ${dataHora}</p>
          <hr>
          <p><a href="${linkGoogleMaps}" target="_blank" style="color: #007bff; font-weight: bold;">📍 Abrir no Google Maps</a></p>
        `;
      }

      // Torna o botão de e-mail visível
      btnEmail.style.display = "block";
    }

    function enviarPorEmail() {
      const dadosSalvos = localStorage.getItem("dadosLocalizacao");
      if (!dadosSalvos) return;

      const { latitude, longitude, precisao, dataHora } = JSON.parse(dadosSalvos);

      const destinatario = "barretog@alunos.utfpr.edu.br";
      const assunto = encodeURIComponent("Relatório de Localização e Coordenadas");
      
      const corpoTexto = `Relatório de Localização:

- Endereço aproximado: ${enderecoTexto}
- Latitude: ${latitude.toFixed(6)}
- Longitude: ${longitude.toFixed(6)}
- Margem de Precisão: ~${Math.round(precisao)} metros
- Registrado em: ${dataHora}
- Link Google Maps: https://www.google.com/maps?q=${latitude},${longitude}
`;

      const corpo = encodeURIComponent(corpoTexto);

      // Dispara o aplicativo padrão de e-mail do sistema
      window.location.href = `mailto:${destinatario}?subject=${assunto}&body=${corpo}`;
    }

    // Executa a busca ao carregar a página
    window.onload = carregarDados;
  </script>

</body>
</html>
